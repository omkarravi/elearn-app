trigger:
- master

pool:
  name: 'ABC'     # Your agent pool name
  demands:
  - agent.name -equals APP-SERVICE-AGENT

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '18.x'
  displayName: 'Install Node.js'

- script: |
    npm install
    npm run build
  displayName: 'Build React App'

- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: 'build'
    includeRootFolder: false
    archiveType: zip
    archiveFile: '$(Build.ArtifactStagingDirectory)/reactapp.zip'
  displayName: 'Archive build artifacts'

- task: PublishBuildArtifacts@1
  inputs:
    pathtoPublish: '$(Build.ArtifactStagingDirectory)/reactapp.zip'
    artifactName: 'reactapp'
  displayName: 'Publish Artifact'

- task: AzureWebApp@1
  displayName: 'Deploy to Azure Linux Web App'
  inputs:
    azureSubscription: 'app-service'     # Your service connection name
    appType: 'webAppLinux'
    appName: 'react-webapp-devops'         # Your Terraform output WebApp Name
    package: '$(Build.ArtifactStagingDirectory)/reactapp.zip'
